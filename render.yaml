# Render Blueprint — one-click deploy of docchat on Render's free tier.
#
#   1. Push this repo to GitHub.
#   2. On Render: New → Blueprint → connect this repo.
#   3. It provisions a free Postgres + web service and deploys.
#
# Note on free-tier limits: web services sleep after 15 min idle (cold start
# ~30–60s on first visit), and free Postgres databases expire after 90 days.

databases:
  - name: docchat-db
    databaseName: docchat
    user: docchat
    plan: free

services:
  - type: web
    name: docchat
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DOCCHAT_DATABASE_URL
        fromDatabase:
          name: docchat-db
          property: connectionString
      - key: DOCCHAT_SECRET_KEY
        generateValue: true
      - key: DOCCHAT_EMBEDDING_PROVIDER
        value: tfidf
      - key: DOCCHAT_LLM_PROVIDER
        value: none
      - key: DOCCHAT_AUTH_ENABLED
        value: "true"
      - key: DOCCHAT_SEED_DEMO_USER
        value: "true"
